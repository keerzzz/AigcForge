name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Link aigcfroge CLI
        run: cd packages/aigcfroge && bun link

      - name: Triage issue
        env:
          AIGCFROGE_API_KEY: ${{ secrets.AIGCFROGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_ROBOT_MODEL || vars.AI_MODEL }}
          AIGCFROGE_PERMISSION: |
            {
              "bash": {
                "*": "allow"
              }
            }
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ] && [ -z "$AIGCFROGE_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            echo "::notice::No LLM API key configured in GitHub Secrets. Skipping issue triage."
            exit 0
          fi

          MODEL=""
          if [ -n "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            if [[ "$AI_MODEL" == google/* ]] || [[ "$AI_MODEL" == gemini/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="google/gemini-2.5-flash"
            fi
          elif [ -n "$DEEPSEEK_API_KEY" ]; then
            if [[ "$AI_MODEL" == deepseek/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="deepseek/deepseek-chat"
            fi
          elif [ -n "$OPENAI_API_KEY" ]; then
            if [[ "$AI_MODEL" == openai/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="openai/gpt-4o"
            fi
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            if [[ "$AI_MODEL" == anthropic/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="anthropic/claude-3-5-sonnet"
            fi
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            if [[ "$AI_MODEL" == openrouter/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="openrouter/anthropic/claude-3.5-sonnet"
            fi
          elif [ -n "$AIGCFROGE_API_KEY" ]; then
            MODEL="${AI_MODEL:-aigcfroge/claude-sonnet-4-6}"
          fi

          echo "Using model: $MODEL"
          bun ./packages/aigcfroge/src/index.ts run -m "$MODEL" "The following issue was just opened, triage it:

          Title: $ISSUE_TITLE

          $ISSUE_BODY"
