name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  lint-test-typecheck:
    name: Lint, Test, and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Typecheck
        run: bun turbo typecheck

      - name: Test
        run: bun turbo test
