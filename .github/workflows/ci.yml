name: V2 idle offset paging verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paging:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: true
      PLAYWRIGHT_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Read frozen payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Preserve exact patch
        run: |
          cp .github/acceptance/candidate.patch "$RUNNER_TEMP/candidate.patch"
          cp .github/acceptance/candidate-files.json "$RUNNER_TEMP/candidate-files.json"
          test "$(sha256sum "$RUNNER_TEMP/candidate.patch" | cut -d' ' -f1)" = 855ec9a6f447b5144fe7a01cee23e42cd0820e64a99090e38f2a84647914ac91
      - name: Checkout exact PR merge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 986c9fd8f29a2f4cf896e019d8c2a7352589b73d
          fetch-depth: 2
      - name: Verify production candidate and original keeper
        run: |
          test "$(git rev-parse HEAD^1)" = d11d3c7c16f0bcf318a0197bfb647c3cf81b06fd
          test "$(git rev-parse HEAD^2)" = 09352951d18f52f46a1f9144a29b93748bb0f1c6
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          test "$(sha256sum packages/app/src/session/timeline/observe-element-offset.ts | cut -d' ' -f1)" = 5a7421e973cc0f075b79ce3388cb7ffb3324230953b994b307e048d6cebf2570
          test "$(sha256sum packages/app/e2e/regression/timeline-history.spec.ts | cut -d' ' -f1)" = 63db63ced773983d944645e003af8bba5905376a50c7b0f5f2c1cdc88ba35c6d
          git diff --stat
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15'
      - name: Install Chromium
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium
      - name: Run original paging keeper three times
        working-directory: packages/app
        run: bunx playwright test regression/timeline-history.spec.ts --grep 'mounts every part once' --workers=1 --retries=0 --repeat-each=3 --reporter=line
