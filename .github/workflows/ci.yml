name: V2 final integration quality verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Read frozen payload
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Preserve exact payload
        run: |
          git rev-parse HEAD
          cp .github/acceptance/candidate.patch "$RUNNER_TEMP/candidate.patch"
          cp .github/acceptance/candidate-files.json "$RUNNER_TEMP/candidate-files.json"
          test "$(sha256sum "$RUNNER_TEMP/candidate.patch" | cut -d' ' -f1)" = 0ef93f8919676b3f2cacdf5139d6e2bfd776d56325548e9618d301bf300ae657
          test "$(sha256sum "$RUNNER_TEMP/candidate-files.json" | cut -d' ' -f1)" = 424719afdea64d211702a450848bf7764ca76a25aed19427da3ccc6f0ea4b9c2
      - name: Checkout exact PR merge
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 986c9fd8f29a2f4cf896e019d8c2a7352589b73d
          fetch-depth: 2
      - name: Verify and apply complete candidate
        run: |
          test "$(git rev-parse HEAD)" = 986c9fd8f29a2f4cf896e019d8c2a7352589b73d
          test "$(git rev-parse HEAD^1)" = d11d3c7c16f0bcf318a0197bfb647c3cf81b06fd
          test "$(git rev-parse HEAD^2)" = 09352951d18f52f46a1f9144a29b93748bb0f1c6
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {createHash} from "node:crypto"; const files=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/candidate-files.json","utf8")); for(const [path,sha] of Object.entries(files)){if(createHash("sha256").update(readFileSync(path)).digest("hex")!==sha) throw new Error(path); console.log("CANDIDATE_FILE",path,sha)}'
          git diff --stat
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15'
      - name: Run complete canonical checks
        run: bun run check
      - name: Check App E2E types
        run: bun --cwd packages/app typecheck:e2e
      - name: Verify approved migration ancestor
        run: |
          git fetch --no-tags --deepen=16 origin 986c9fd8f29a2f4cf896e019d8c2a7352589b73d
          git merge-base --is-ancestor 928377ca374b85f4e1080b3ee836d4bb75c0fdfb HEAD
      - name: Run approved snapshot increment
        run: bun run lint:changed 928377ca374b85f4e1080b3ee836d4bb75c0fdfb
