name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  lint-test-typecheck:
    name: Lint, Test, and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun turbo typecheck

      - name: Test
        run: bun turbo test
