name: V2 focused acceptance
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit
        required: true
        type: string
      baseline_ref:
        description: Optional paired baseline on the same runner
        required: false
        type: string
      check:
        description: Focused check
        required: true
        default: benchmark
        type: choice
        options: [benchmark, regression, windows_unit]
permissions:
  contents: read
concurrency:
  group: v2-focused-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ${{ inputs.check == 'windows_unit' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      CI: true
      PLAYWRIGHT_BUILD: '1'
      PLAYWRIGHT_WORKERS: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      SOURCE_REF: ${{ inputs.source_ref }}
      BASELINE_REF: ${{ inputs.baseline_ref }}
      TIMELINE_CPU_THROTTLE: '30'
      TIMELINE_HISTORY_TURNS: '320'
      TIMELINE_DELTA_COUNT: '160'
      TIMELINE_EVENT_BATCH: '1'
      TIMELINE_MINIMAL: '0'
      TIMELINE_CPU_PROFILE: '0'
      TIMELINE_VISUAL_PROFILE: '0'
      TIMELINE_SEARCH_HISTORY_TURNS: '320'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 2
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15'
      - name: Record Windows source and runner
        id: windows_source
        if: inputs.check == 'windows_unit'
        shell: bash
        run: |
          test "$RUNNER_OS" = "Windows"
          test "$SOURCE_REF" = "3f8742421348e4ec429199b473b3ae5f9d660afe"
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          mkdir -p acceptance-results
          git rev-parse HEAD > acceptance-results/source-head.txt
          git config --global user.email "bot@aigcfroge.ai"
          git config --global user.name "aigcfroge"
          git config --global --get user.email > acceptance-results/git-identity.txt
          git config --global --get user.name >> acceptance-results/git-identity.txt
          printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" > acceptance-results/runner.txt
          uname -a >> acceptance-results/runner.txt
          git --version >> acceptance-results/runner.txt
          bun --version >> acceptance-results/runner.txt
          node --version >> acceptance-results/runner.txt
          cat acceptance-results/source-head.txt
          cat acceptance-results/git-identity.txt
          cat acceptance-results/runner.txt
      - name: Windows Server stale-root contract
        if: inputs.check == 'windows_unit'
        working-directory: packages/server
        shell: bash
        env:
          AIGCFROGE_EXPERIMENTAL_DISABLE_FILEWATCHER: 'true'
        run: |
          set -o pipefail
          GITHUB_ACTIONS=false bun run test test/custom-composition.test.ts -t '^rejects stale builtin root confirmation over HTTP without Session residue$' --timeout 30000 2>&1 | tee ../../acceptance-results/windows-server.log
      - name: Windows Core MC07 R2 contract
        if: ${{ !cancelled() && inputs.check == 'windows_unit' && steps.windows_source.outcome == 'success' }}
        working-directory: packages/core
        shell: bash
        env:
          AIGCFROGE_EXPERIMENTAL_DISABLE_FILEWATCHER: 'true'
        run: |
          set -o pipefail
          GITHUB_ACTIONS=false bun run test test/meta-agent-integration.test.ts -t '^MC07 R2 repairs the same child and requires the current typed review$' 2>&1 | tee ../../acceptance-results/windows-core.log
      - name: Record source and runner
        if: inputs.check != 'windows_unit'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          mkdir -p acceptance-results
          git rev-parse HEAD > acceptance-results/source-head.txt
          uname -a > acceptance-results/runner.txt
          lscpu >> acceptance-results/runner.txt
          bun --version >> acceptance-results/runner.txt
          node --version >> acceptance-results/runner.txt
      - name: Install Chromium
        if: inputs.check != 'windows_unit'
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium
      - name: Paired baseline
        if: inputs.check == 'benchmark' && inputs.baseline_ref != ''
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "$BASELINE_REF"
          git checkout --detach "$BASELINE_REF"
          test "$(git rev-parse HEAD)" = "$BASELINE_REF"
          cd packages/app
          bunx playwright test --config e2e/performance/playwright.config.ts timeline/session-entry-benchmark.spec.ts timeline/session-timeline-benchmark.spec.ts timeline/session-timeline-search-benchmark.spec.ts --grep 'entry: new session from session|streams assistant text without remounting or oscillating|searches a large virtualized session and reveals the first result' --workers=1 --retries=0 --repeat-each=3 --reporter=line 2>&1 | tee ../../acceptance-results/baseline.log
          cd ../..
          git checkout --detach "$SOURCE_REF"
      - name: Production benchmark
        if: inputs.check == 'benchmark'
        working-directory: packages/app
        shell: bash
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          bunx playwright test --config e2e/performance/playwright.config.ts timeline/session-entry-benchmark.spec.ts timeline/session-timeline-benchmark.spec.ts timeline/session-timeline-search-benchmark.spec.ts --grep 'entry: new session from session|streams assistant text without remounting or oscillating|searches a large virtualized session and reveals the first result' --workers=1 --retries=0 --repeat-each=3 --reporter=line 2>&1 | tee ../../acceptance-results/candidate.log
      - name: Focused production regression
        if: inputs.check == 'regression'
        working-directory: packages/app
        shell: bash
        run: |
          set -o pipefail
          bunx playwright test regression/composer.spec.ts user-story/model-selection-flow.spec.ts regression/session-header.spec.ts regression/review.spec.ts regression/timeline-stream.spec.ts regression/timeline-history.spec.ts --grep 'thinking on hover|new project|restores each existing|SC02|review toggle stays|separates blocking|only running subagent|mounts every part' --workers=1 --retries=0 --reporter=line 2>&1 | tee ../../acceptance-results/regression.log
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-${{ inputs.check }}-${{ github.run_id }}
          retention-days: 7
          path: acceptance-results
