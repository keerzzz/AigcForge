name: ai-runner-diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile
      - name: Probe Google API without the agent
        continue-on-error: true
        timeout-minutes: 1
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          AI_MODEL: ${{ vars.AI_ROBOT_MODEL || 'google/gemini-3.7-flash' }}
        run: |
          bun -e '
            const key = process.env.GOOGLE_GENERATIVE_AI_API_KEY;
            if (!key) throw new Error("No Google API key configured");
            const model = process.env.AI_MODEL.replace(/^(google|gemini)\//, "");
            if (!/^gemini-[a-zA-Z0-9.-]+$/.test(model)) throw new Error("Invalid probe model");
            const start = Date.now();
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
              method: "POST",
              headers: { "content-type": "application/json", "x-goog-api-key": key },
              body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Reply with only OK." }] }], generationConfig: { maxOutputTokens: 128 } }),
              signal: AbortSignal.timeout(45000),
            });
            const text = (await response.text()).replaceAll(key, "[redacted]");
            console.log(JSON.stringify({ model, status: response.status, durationMs: Date.now() - start, body: text.slice(0, 2000) }));
            if (!response.ok) process.exitCode = 1;
          '
      - name: Probe CLI with stage logs and no tool permissions
        continue-on-error: true
        timeout-minutes: 4
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          AI_MODEL: ${{ vars.AI_ROBOT_MODEL || 'google/gemini-3.7-flash' }}
          AIGCFROGE_PERMISSION: '{"*":"deny"}'
        run: |
          timeout --signal=TERM --kill-after=5s 180s bun ./packages/aigcfroge/src/index.ts --print-logs --log-level DEBUG run --agent build --model "$AI_MODEL" 'Reply with only OK. Do not call tools.'
