name: publish
run-name: "${{ github.event_name == 'workflow_run' && format('desktop auto {0}', github.event.workflow_run.head_sha) || format('{0} {1}', inputs.release_mode == 'desktop-draft' && 'desktop draft' || 'release', inputs.version || inputs.bump || 'patch') }}"

on:
  push:
    branches:
      - ci
      - dev
      - beta
      - fix/npm-native-binary-install
      - snapshot-*
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string
      release_mode:
        description: "desktop-draft builds and stages a desktop release without publishing. full is the legacy complete release."
        required: true
        default: desktop-draft
        type: choice
        options:
          - desktop-draft
          - full

# Serialize release work. `cancel-in-progress: false` keeps a running build
# alive; GitHub's default single-pending slot means only the newest queued main
# state survives, which is what we want for release candidates.
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    if: >-
      github.repository == 'keerzzz/AigcForge' &&
      (github.event_name != 'workflow_run' ||
       (vars.AIGCFROGE_DESKTOP_AUTOMATION != '' && vars.AIGCFROGE_DESKTOP_AUTOMATION != 'off' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      # workflow_run starts from trusted default-branch code, never a PR checkout.
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-git-committer
        id: committer
        with:
          aigcfroge-app-id: ${{ vars.AIGCFROGE_APP_ID }}
          aigcfroge-app-secret: ${{ secrets.AIGCFROGE_APP_SECRET }}
          require-app: ${{ github.event_name == 'workflow_run' }}
      - name: Resolve release intent
        id: plan
        run: bun script/desktop-release.ts plan
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ (github.ref_name == 'beta' && 'keerzzz/AigcForge-beta') || github.repository }}
          AIGCFROGE_DESKTOP_AUTOMATION: ${{ vars.AIGCFROGE_DESKTOP_AUTOMATION }}
          AIGCFROGE_RELEASE_BOT: ${{ steps.committer.outputs.app-slug }}[bot]

  prepare-version:
    needs: guard
    if: needs.guard.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-git-committer
        id: committer
        with:
          aigcfroge-app-id: ${{ vars.AIGCFROGE_APP_ID }}
          aigcfroge-app-secret: ${{ secrets.AIGCFROGE_APP_SECRET }}
          require-app: "true"
      - name: Prepare a version-only PR and enable checked auto-merge
        run: bun script/desktop-release.ts prepare
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ github.repository }}
          AIGCFROGE_RELEASE_SHA: ${{ needs.guard.outputs.sha }}
          AIGCFROGE_VERSION: ${{ needs.guard.outputs.version }}
          AIGCFROGE_RELEASE_BOT: ${{ steps.committer.outputs.app-slug }}[bot]

  changelog:
    needs: guard
    if: needs.guard.outputs.mode == 'desktop-draft' || needs.guard.outputs.mode == 'desktop-release' || needs.guard.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Generate AI release notes
        id: generate
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          AIGCFROGE_API_KEY: ${{ secrets.AIGCFROGE_API_KEY }}
          AI_MODEL: ${{ vars.AI_ROBOT_MODEL || vars.AI_MODEL }}
          AIGCFROGE_PERMISSION: |
            {
              "bash": {
                "*": "deny",
                "git show*": "allow",
                "git diff*": "allow"
              },
              "webfetch": "deny"
            }
        run: |
          if [ -n "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            if [[ "$AI_MODEL" == google/* ]] || [[ "$AI_MODEL" == gemini/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="google/gemini-3.7-flash"
            fi
          elif [ -n "$AIGCFROGE_API_KEY" ]; then
            MODEL="${AI_MODEL:-aigcfroge/gpt-5.4}"
          else
            echo "::notice::No LLM API key configured for release notes; using deterministic changelog."
            exit 0
          fi
          echo "Using model: $MODEL"
          bun script/changelog.ts --to "${{ needs.guard.outputs.sha }}" --model "$MODEL"
          test -s UPCOMING_CHANGELOG.md
          grep -Eq '^## English[[:space:]]*$' UPCOMING_CHANGELOG.md
          grep -Eq '^## 中文[[:space:]]*$' UPCOMING_CHANGELOG.md
      - name: Upload generated release notes
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: UPCOMING_CHANGELOG.md
          if-no-files-found: ignore
          retention-days: 1

  version:
    needs:
      - guard
      - changelog
    runs-on: ubuntu-latest
    if: always() && !cancelled() && (needs.guard.outputs.mode == 'desktop-draft' || needs.guard.outputs.mode == 'desktop-release' || needs.guard.outputs.mode == 'full')
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Download generated release notes
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: /tmp/release-notes

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          aigcfroge-app-id: ${{ vars.AIGCFROGE_APP_ID }}
          aigcfroge-app-secret: ${{ secrets.AIGCFROGE_APP_SECRET }}

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          AIGCFROGE_BUMP: ${{ inputs.bump }}
          AIGCFROGE_VERSION: ${{ needs.guard.outputs.version }}
          AIGCFROGE_RELEASE_NOTES_STRICT: ${{ needs.guard.outputs.mode != 'full' }}
          AIGCFROGE_RELEASE_NOTES_FILE: /tmp/release-notes/UPCOMING_CHANGELOG.md
          AIGCFROGE_DETERMINISTIC_RELEASE_NOTES: "true"
          GH_REPO: ${{ (github.ref_name == 'beta' && 'keerzzz/AigcForge-beta') || github.repository }}
    outputs:
      published: ${{ steps.version.outputs.published }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-electron:
    needs:
      - guard
      - version
    if: github.repository == 'keerzzz/AigcForge' && needs.version.outputs.published != 'true'
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macos-15-intel is GitHub's current standard x64 image for public repos.
          # macos-13 is retired; see actions/runner-images.
          - host: macos-15-intel
            target: x86_64-apple-darwin
            platform_flag: --mac
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-latest
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # github-hosted: blacksmith lacks ARM64 MSVC cross-compilation toolchain
          - host: "windows-latest"
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: "windows-latest"
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: "ubuntu-latest"
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: "ubuntu-latest"
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          # Explicit Owner opt-in for publishing unsigned artifacts. Automation is
          # fail closed without it, so an unsigned public release can never be a silent
          # downgrade; see ADR-26 §3.
          AIGCFROGE_ALLOW_UNSIGNED: ${{ vars.AIGCFROGE_ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ "${{ needs.guard.outputs.mode }}" = "desktop-release" ]; then
            if [ "$RUNNER_OS" = "macOS" ] && { [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_PATH" ]; }; then
              if [ "$AIGCFROGE_ALLOW_UNSIGNED" = "true" ]; then
                echo "::warning::AIGCFROGE_ALLOW_UNSIGNED_RELEASE=true; publishing an UNSIGNED macOS release"
              else
                echo "::error::Public macOS releases require signing and notarization credentials"
                exit 1
              fi
            fi
            if [ "$RUNNER_OS" = "Windows" ] && { [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ] || [ -z "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" ] || [ -z "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE" ] || [ -z "$AZURE_TRUSTED_SIGNING_ENDPOINT" ]; }; then
              if [ "$AIGCFROGE_ALLOW_UNSIGNED" = "true" ]; then
                echo "::warning::AIGCFROGE_ALLOW_UNSIGNED_RELEASE=true; publishing an UNSIGNED Windows release"
              else
                echo "::error::Public Windows releases require Azure signing credentials"
                exit 1
              fi
            fi
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "macos-available=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos-available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets not configured; macOS app ships unsigned."
          fi
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" ]; then
            echo "windows-available=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows-available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure signing secrets not configured; Windows app ships unsigned."
          fi

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS' && steps.signing.outputs.macos-available == 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS' && steps.signing.outputs.macos-available == 'true'
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          umask 077
          printf '%s' "$APPLE_PRIVATE_KEY" > "$RUNNER_TEMP/apple-api-key.p8"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Azure login
        if: runner.os == 'Windows' && steps.signing.outputs.windows-available == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          aigcfroge-app-id: ${{ vars.AIGCFROGE_APP_ID }}
          aigcfroge-app-secret: ${{ secrets.AIGCFROGE_APP_SECRET }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          AIGCFROGE_VERSION: ${{ needs.version.outputs.version }}
          AIGCFROGE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          RUST_TARGET: ${{ matrix.settings.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          AIGCFROGE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}

      - name: Package
        if: needs.version.outputs.release
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          AIGCFROGE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          AIGCFROGE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS' && needs.version.outputs.release
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="aigcfroge-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="aigcfroge-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows' && steps.signing.outputs.windows-available == 'true'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName

          if ($files.Count -eq 0) { throw "No Windows executables found for signature verification" }
          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Verify signed and notarized macOS bundle
        if: runner.os == 'macOS' && needs.guard.outputs.mode == 'desktop-release' && steps.signing.outputs.macos-available == 'true'
        shell: bash
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
          else
            APP_DIR="mac-arm64"
          fi
          app=$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aigcfroge-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml
          if-no-files-found: error

      - name: Upload desktop assets to release
        if: needs.version.outputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        working-directory: packages/desktop
        run: |
          shopt -s nullglob
          files=(dist/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} dist/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No desktop release assets to upload for this platform"
            exit 1
          fi
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber --repo "${{ needs.version.outputs.repo }}"

  finalize-desktop-draft:
    needs:
      - guard
      - version
      - build-electron
    if: always() && !failure() && !cancelled() && needs.version.outputs.published != 'true' && (needs.guard.outputs.mode == 'desktop-draft' || needs.guard.outputs.mode == 'desktop-release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          aigcfroge-app-id: ${{ vars.AIGCFROGE_APP_ID }}
          aigcfroge-app-secret: ${{ secrets.AIGCFROGE_APP_SECRET }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aigcfroge-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Require all platform update metadata
        shell: bash
        run: |
          test -f /tmp/latest-yml/latest-yml-x86_64-pc-windows-msvc/latest.yml
          test -f /tmp/latest-yml/latest-yml-aarch64-pc-windows-msvc/latest.yml
          test -f /tmp/latest-yml/latest-yml-x86_64-apple-darwin/latest-mac.yml
          test -f /tmp/latest-yml/latest-yml-aarch64-apple-darwin/latest-mac.yml
          test -f /tmp/latest-yml/latest-yml-x86_64-unknown-linux-gnu/latest-linux.yml
          test -f /tmp/latest-yml/latest-yml-aarch64-unknown-linux-gnu/latest-linux-arm64.yml

      - name: Finalize desktop draft update metadata
        run: bun ./packages/desktop/scripts/finalize-latest-yml.ts
        env:
          AIGCFROGE_VERSION: ${{ needs.version.outputs.version }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          LATEST_YML_DIR: /tmp/latest-yml

      - name: Verify same-run assets and optionally publish
        run: bun script/desktop-release.ts "${{ needs.guard.outputs.mode == 'desktop-release' && 'publish' || 'verify' }}"
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          AIGCFROGE_RELEASE_SHA: ${{ needs.guard.outputs.sha }}
          AIGCFROGE_VERSION: ${{ needs.version.outputs.version }}
          AIGCFROGE_DESKTOP_AUTOMATION: ${{ vars.AIGCFROGE_DESKTOP_AUTOMATION }}
          DESKTOP_METADATA_DIR: ${{ runner.temp }}
          DESKTOP_ARTIFACT_DIR: /tmp/desktop

  publish:
    needs:
      - guard
      - version
      - build-electron
    if: always() && !failure() && !cancelled() && needs.guard.outputs.mode == 'full' && needs.version.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        with:
          pattern: aigcfroge-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          aigcfroge-app-id: ${{ vars.AIGCFROGE_APP_ID }}
          aigcfroge-app-secret: ${{ secrets.AIGCFROGE_APP_SECRET }}

      - name: Cache apt packages (AUR)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "aigcfroge@sst.dev"
          git config --global user.name "aigcfroge"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - name: Upload desktop release assets
        if: needs.version.outputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No desktop release assets found"
            exit 1
          fi
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber --repo "${{ needs.version.outputs.repo }}"

      - run: ./script/publish.ts
        env:
          AIGCFROGE_VERSION: ${{ needs.version.outputs.version }}
          AIGCFROGE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
