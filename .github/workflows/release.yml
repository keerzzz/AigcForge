name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Build Binary (Linux x64)
        run: bun run --cwd packages/cli build --single

      - name: Package Release
        run: |
          mkdir -p release
          cp packages/cli/dist/cli-linux-x64/bin/aigcfroge release/
          cd release
          tar -czvf aigcfroge-linux-x64.tar.gz aigcfroge
          sha256sum aigcfroge-linux-x64.tar.gz > aigcfroge-linux-x64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            release/aigcfroge-linux-x64.tar.gz
            release/aigcfroge-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
