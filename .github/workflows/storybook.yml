name: storybook

on:
  push:
    branches: [dev, main]
    paths:
      - ".github/workflows/storybook.yml"
      - ".github/workflows/ci-scope.yml"
      - "packages/script/src/pr-ci.mjs"
      - "package.json"
      - "bun.lock"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [dev, main]
    paths:
      - ".github/workflows/storybook.yml"
      - ".github/workflows/ci-scope.yml"
      - "packages/script/src/pr-ci.mjs"
      - "package.json"
      - "bun.lock"
      - "packages/storybook/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.head_ref != 'release-candidate' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  build:
    name: ${{ needs.scope.outputs.prefix }}storybook build
    needs: scope
    if: needs.scope.outputs.lane == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build Storybook
        run: bun --cwd packages/storybook build
