name: review

on:
  issue_comment:
    types: [created]

concurrency:
  group: review-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check-guidelines:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Link aigcfroge CLI
        run: cd packages/aigcfroge && bun link

      - name: Get PR details
        id: pr-details
        run: |
          gh api /repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }} > pr_data.json
          gh pr diff ${{ steps.pr-number.outputs.number }} > pr.diff
          echo "title=$(jq -r .title pr_data.json)" >> $GITHUB_OUTPUT
          echo "sha=$(jq -r .head.sha pr_data.json)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Review PR semantics
        timeout-minutes: 10
        env:
          AIGCFROGE_API_KEY: ${{ secrets.AIGCFROGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_ROBOT_MODEL || vars.AI_MODEL }}
          AIGCFROGE_PERMISSION: |
            {
              "*": "deny",
              "read": {
                "*": "allow",
                "*.env": "deny",
                "*.env.*": "deny",
                "*.env.example": "allow"
              },
              "glob": "allow",
              "bash": {
                "*": "deny",
                "gh api*--method POST*/repos/*/pulls/*/comments*": "allow",
                "gh api*/repos/*/issues/*/comments*--method POST*-f body=lgtm": "allow",
                "*$*": "deny",
                "*--hostname*": "deny",
                "*--input*": "deny",
                "*--verbose*": "deny",
                "*--jq*": "deny",
                "*--template*": "deny",
                "* -q*": "deny",
                "*\t-q*": "deny",
                "*\n-q*": "deny",
                "* -t*": "deny",
                "*--body-file*": "deny",
                "*-F*@*": "deny",
                "*--field*@*": "deny",
                "*@/*": "deny",
                "* /proc/*": "deny"
              }
            }
          PR_TITLE: ${{ steps.pr-details.outputs.title }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ] && [ -z "$AIGCFROGE_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            echo "::notice::No LLM API key configured in GitHub Secrets. Skipping PR review."
            exit 0
          fi

          MODEL=""
          if [ -n "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            if [[ "$AI_MODEL" == google/* ]] || [[ "$AI_MODEL" == gemini/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="google/gemini-3.7-flash"
            fi
          elif [ -n "$DEEPSEEK_API_KEY" ]; then
            if [[ "$AI_MODEL" == deepseek/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="deepseek/deepseek-chat"
            fi
          elif [ -n "$OPENAI_API_KEY" ]; then
            if [[ "$AI_MODEL" == openai/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="openai/gpt-4o"
            fi
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            if [[ "$AI_MODEL" == anthropic/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="anthropic/claude-3-5-sonnet"
            fi
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            if [[ "$AI_MODEL" == openrouter/* ]]; then
              MODEL="$AI_MODEL"
            else
              MODEL="openrouter/anthropic/claude-3.5-sonnet"
            fi
          elif [ -n "$AIGCFROGE_API_KEY" ]; then
            MODEL="${AI_MODEL:-aigcfroge/gpt-5.5}"
          fi

          echo "Using model: $MODEL"
          PR_BODY=$(jq -r .body pr_data.json)
          bun ./packages/aigcfroge/src/index.ts run --agent build -m "$MODEL" "A new pull request has been created: '${PR_TITLE}'

          <pr-number>
          ${{ steps.pr-number.outputs.number }}
          </pr-number>

          <pr-description>
          $PR_BODY
          </pr-description>

          The pull request diff is available at pr.diff. Focus on behavioral bugs, security issues, concurrency hazards, regressions, data loss, and missing tests that could let those defects through. Read the surrounding files when the diff alone is insufficient.

          Do not spend review comments on formatting, naming preferences, dead code, or style issues already covered by Prettier, typecheck, lint, or pr-standards. State only issues you can support with concrete code evidence. Do not invent a problem to justify the review, and do not claim to have reviewed files or behavior you did not inspect.

          Add at most 5 inline comments, highest severity first. Make clear the findings are suggestions for the human reviewer. If you have a suggested fix, include it as a valid suggestion block; otherwise explain the risk and leave the decision to the author. Do not modify the repository.

          Use the gh cli to create comments on the files for the findings. Try to leave the comment on the exact line number. If you have a suggested fix include it in a suggestion code block.
          If you are writing suggested fixes, BE SURE THAT the change you are recommending is actually valid typescript, often I have seen missing closing "}" or other syntax errors.
          Generally, write a comment instead of writing suggested change if you can help it.

          Command MUST be like this.
          \`\`\`
          gh api \
            --method POST \
            -H \"Accept: application/vnd.github+json\" \
            -H \"X-GitHub-Api-Version: 2022-11-28\" \
            /repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }}/comments \
            -f 'body=[summary of issue]' -f 'commit_id=${{ steps.pr-details.outputs.sha }}' -f 'path=[path-to-file]' -F \"line=[line]\" -f 'side=RIGHT'
          \`\`\`

          Only create comments for concrete issues. If no concrete issue is found, post an issue comment with exactly this command and NOTHING ELSE:
          \`gh api /repos/${{ github.repository }}/issues/${{ steps.pr-number.outputs.number }}/comments --method POST -f body=lgtm\`."
