name: "Setup Git Committer"
description: "Configure git user"
inputs:
  aigcfroge-app-id:
    description: "Aigcfroge GitHub App ID"
    required: false
  aigcfroge-app-secret:
    description: "Aigcfroge GitHub App private key"
    required: false
outputs:
  token:
    description: "GitHub App token or GitHub Token"
    value: ${{ steps.apptoken.outputs.token || github.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug || 'github-actions' }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      if: inputs.aigcfroge-app-id != '' && inputs.aigcfroge-app-secret != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.aigcfroge-app-id }}
        private-key: ${{ inputs.aigcfroge-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug || 'github-actions' }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        token="${{ steps.apptoken.outputs.token || github.token }}"
        echo "::add-mask::$token"
        git remote set-url origin https://x-access-token:${token}@github.com/${{ github.repository }}
      shell: bash
