name: "Setup Git Committer"
description: "Configure git user"
inputs:
  omnixa-app-id:
    description: "Omnixa GitHub App ID"
    required: false
  omnixa-app-secret:
    description: "Omnixa GitHub App private key"
    required: false
  require-app:
    description: "Fail instead of falling back when an unattended workflow requires an App"
    required: false
    default: "false"
outputs:
  token:
    description: "GitHub App token or GitHub Token"
    value: ${{ steps.apptoken.outputs.token || github.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug || 'github-actions' }}
runs:
  using: "composite"
  steps:
    - name: Require configured GitHub App
      if: inputs.require-app == 'true'
      shell: bash
      env:
        APP_ID: ${{ inputs.omnixa-app-id }}
        APP_PRIVATE_KEY: ${{ inputs.omnixa-app-secret }}
      run: |
        if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
          echo "::error::OMNIXA_APP_ID and OMNIXA_APP_SECRET are required for unattended release PRs"
          exit 1
        fi
    - name: Create app token
      id: apptoken
      if: inputs.omnixa-app-id != '' && inputs.omnixa-app-secret != ''
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.omnixa-app-id }}
        private-key: ${{ inputs.omnixa-app-secret }}
        owner: ${{ github.repository_owner }}

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug || 'github-actions' }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        token="${{ steps.apptoken.outputs.token || github.token }}"
        echo "::add-mask::$token"
        git remote set-url origin https://x-access-token:${token}@github.com/${{ github.repository }}
      shell: bash
